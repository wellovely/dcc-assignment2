syntax = "proto3"; // это версия языка protobuf
package counter; // пространство имен, чтобы имена не конфликтовали с другими proto

service Counter {
  rpc Increment (IncrementRequest) returns (IncrementReply);
  rpc Get       (GetRequest)       returns (GetReply);
}

message IncrementRequest {
  string counter_id      = 1;
  int64  delta           = 2;
  string idempotency_key = 3;   // client-generated, unique per logical operation
}
message IncrementReply { int64 new_value = 1; bool was_duplicate = 2; }

message GetRequest { string counter_id = 1; }
message GetReply   { int64 value = 1; bool found = 2; }